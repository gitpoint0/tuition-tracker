<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Tuition Tracker</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen font-sans pb-12">

<nav class="bg-indigo-600 text-white p-3.5 shadow flex justify-between items-center sticky top-0 z-10">
  <div>
    <h1 id="navTitle" class="text-base font-bold">📚 Smart Tuition Tracker</h1>
    <div class="flex items-center gap-2">
      <p id="modeText" class="text-[11px] text-indigo-200">Mode: Admin (Unlocked 🔓)</p>
      <span id="cloudStatus" class="text-[10px] bg-indigo-800 px-2 py-0.5 rounded-full text-amber-300">⏳ Connecting Cloud...</span>
    </div>
  </div>
  <button onclick="handleRoleSwitch()" id="roleBtn" class="bg-slate-900 text-white px-3 py-1.5 rounded-lg text-xs font-bold border border-indigo-400">
    Lock Parent View 🔒
  </button>
</nav>

<div class="max-w-xl mx-auto p-3 mt-1">
  <div id="msgBox" class="hidden mb-3 p-2.5 rounded-lg bg-emerald-600 text-white text-xs font-bold text-center"></div>

  <div id="adminPanel" class="space-y-3 mb-5">
    <!-- Settings -->
    <div class="bg-slate-800 p-3.5 rounded-xl border border-slate-700">
      <div onclick="toggleBox('settingsBody')" class="flex justify-between items-center cursor-pointer">
        <span class="text-xs font-bold text-indigo-400">⚙️ Tuition, UPI & PIN Settings</span>
        <span class="text-xs text-slate-400">Open ▼</span>
      </div>
      <div id="settingsBody" class="hidden mt-3 pt-3 border-t border-slate-700 space-y-2">
        <input id="setTuition" placeholder="Tuition Name" class="bg-slate-700 text-white p-2 rounded-lg text-xs w-full">
        <input id="setUpi" placeholder="Your UPI ID (e.g. 9876543210@ybl)" class="bg-slate-700 text-white p-2 rounded-lg text-xs w-full">
        <input id="setPin" placeholder="Admin PIN (Default: 1234)" class="bg-slate-700 text-white p-2 rounded-lg text-xs w-full">
        <button onclick="saveSettings()" class="bg-indigo-600 text-white rounded-lg p-2 text-xs font-bold w-full">💾 Save Settings</button>
      </div>
    </div>

    <!-- Add Student -->
    <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 space-y-2.5">
      <h2 class="text-sm font-bold text-white">➕ Add New Student</h2>
      <input id="stuName" placeholder="Student Name (e.g. Rajkishor Kumar)" class="bg-slate-700 border border-slate-600 text-white p-2.5 rounded-lg text-sm w-full">
      <input id="stuPhone" type="tel" placeholder="Parent WhatsApp No. (Optional)" class="bg-slate-700 border border-slate-600 text-white p-2.5 rounded-lg text-sm w-full">
      <div class="grid grid-cols-2 gap-2">
        <input id="joinDate" type="date" class="bg-slate-700 border border-slate-600 text-white p-2.5 rounded-lg text-sm w-full">
        <input id="monthlyFee" type="number" placeholder="Fee (₹)" class="bg-slate-700 border border-slate-600 text-white p-2.5 rounded-lg text-sm w-full">
      </div>
      <button onclick="addStudent()" class="bg-indigo-600 active:bg-indigo-800 text-white rounded-lg p-2.5 text-sm font-bold w-full">
        Save Student Profile
      </button>
    </div>
  </div>

  <input oninput="renderList()" id="searchBox" placeholder="🔍 Search student by name..." class="bg-slate-800 border border-slate-700 text-white p-2.5 rounded-xl text-sm w-full mb-3">

  <h2 class="text-sm font-bold mb-2 text-slate-300">👨‍🎓 Students Profiles & Fee Status</h2>
  <div id="studentList" class="space-y-2.5"></div>
</div>

<!-- PIN Modal -->
<div id="pinModal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-4 z-30">
  <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-xs w-full p-4 text-center">
    <h3 class="text-sm font-bold text-white mb-1">🔐 Enter Admin PIN</h3>
    <p class="text-[11px] text-slate-400 mb-2">Default PIN: 1234</p>
    <input id="pinInput" type="password" placeholder="••••" class="bg-slate-900 border border-slate-600 text-white text-center text-lg p-2 rounded-xl w-full mb-3">
    <div class="flex gap-2">
      <button onclick="toggleBox('pinModal')" class="flex-1 bg-slate-700 py-2 rounded-xl text-xs font-bold">Cancel</button>
      <button onclick="verifyPin()" class="flex-1 bg-indigo-600 py-2 rounded-xl text-xs font-bold">Unlock</button>
    </div>
  </div>
</div>

<!-- Profile Modal -->
<div id="profileModal" class="fixed inset-0 bg-black/80 hidden flex items-center justify-center p-3 z-20">
  <div class="bg-slate-800 border border-slate-700 rounded-2xl max-w-md w-full p-4 max-h-[90vh] overflow-y-auto">
    <div class="flex justify-between items-start border-b border-slate-700 pb-2.5">
      <div>
        <h3 id="mName" class="text-lg font-bold text-white"></h3>
        <p id="mJoin" class="text-xs text-slate-400"></p>
      </div>
      <button onclick="toggleBox('profileModal')" class="text-slate-400 text-lg font-bold px-2">✕</button>
    </div>

    <div class="bg-slate-900 p-3 rounded-xl my-3 grid grid-cols-3 gap-2 text-center border border-slate-700">
      <div><p class="text-[11px] text-slate-400">Monthly</p><p id="mFee" class="font-bold text-sm mt-0.5"></p></div>
      <div><p class="text-[11px] text-slate-400">Total Paid</p><p id="mPaid" class="font-bold text-emerald-400 text-sm mt-0.5"></p></div>
      <div><p class="text-[11px] text-slate-400">Pending Due</p><p id="mDue" class="font-bold text-red-400 text-base mt-0.5"></p></div>
    </div>

    <div id="adminControls" class="space-y-2.5 mb-3">
      <div class="bg-slate-900 p-3 rounded-xl border border-indigo-500/40">
        <label class="block text-xs font-bold text-indigo-300 mb-1.5">💰 Record Fee Payment</label>
        <div class="flex gap-2">
          <input id="payAmt" type="number" placeholder="Amount (₹)" class="bg-slate-800 border border-slate-600 text-white p-2 rounded-lg text-sm flex-1">
          <button onclick="addPayment()" class="bg-emerald-600 text-white px-3 py-2 rounded-lg text-xs font-bold">+ Add Paid</button>
        </div>
      </div>
      <button onclick="sendWhatsApp()" class="w-full bg-green-600 text-white py-2.5 rounded-xl font-bold text-xs">
        📲 Send WhatsApp Fee Reminder
      </button>
    </div>

    <a id="upiBtn" href="#" class="block text-center w-full bg-indigo-600 text-white py-2.5 rounded-xl font-bold text-xs mb-3">
      💳 Pay Pending Fee via UPI
    </a>

    <h4 class="text-[11px] font-bold uppercase text-slate-400 mb-1.5">📜 Payment History</h4>
    <ul id="historyList" class="space-y-1.5 text-xs max-h-40 overflow-y-auto"></ul>

    <div id="delBox" class="mt-4 pt-2.5 border-t border-slate-700 text-right">
      <button onclick="deleteStu()" class="text-xs text-red-400 font-bold">🗑️ Delete Student</button>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyC0gzobslaGZdrwNpHNAamoaAzOlX_30Cg",
    authDomain: "tuition-traker.firebaseapp.com",
    projectId: "tuition-traker",
    storageBucket: "tuition-traker.firebasestorage.app",
    messagingSenderId: "194003123154",
    appId: "1:194003123154:web:bfa0fb5a5bb394abc9260b"
  };

  const app = initializeApp(firebaseConfig);
  const firestoreDb = getFirestore(app);
  const docRef = doc(firestoreDb, "tuition_data", "main_store");

  let db = {
    settings: { name: "Smart Tuition Tracker", upi: "yourname@ybl", pin: "1234" },
    students: [
      { id: 1, name: "Rajkishor Kumar", phone: "", joinDate: "2024-12-01", fee: 500, payments: [
        { amount: 500, time: "05 Dec 2024, 04:30 PM" },
        { amount: 500, time: "30 Oct 2026, 09:39 PM" }
      ]}
    ]
  };

  try {
    let saved = localStorage.getItem('tuition_v4');
    if (saved) db = JSON.parse(saved);
  } catch(e) {}

  let isAdmin = true, activeId = null;

  // Real-Time Cloud Listener
  onSnapshot(docRef, (snap) => {
    const statusBadge = document.getElementById('cloudStatus');
    if (snap.exists()) {
      db = snap.data();
      try { localStorage.setItem('tuition_v4', JSON.stringify(db)); } catch(e) {}
      statusBadge.innerText = "☁️ Cloud Live";
      statusBadge.className = "text-[10px] bg-emerald-900/80 px-2 py-0.5 rounded-full text-emerald-300 font-bold";
      updateUI();
    } else {
      // Pehli baar local data ko cloud par upload karein
      setDoc(docRef, db).then(() => {
        statusBadge.innerText = "☁️ Cloud Synced";
      });
    }
  }, (err) => {
    console.error("Firebase Error:", err);
    document.getElementById('cloudStatus').innerText = "⚠️ Offline Mode";
  });

  function updateUI() {
    document.getElementById('navTitle').innerText = "📚 " + db.settings.name;
    document.getElementById('setTuition').value = db.settings.name;
    document.getElementById('setUpi').value = db.settings.upi;
    document.getElementById('setPin').value = db.settings.pin;
    renderList();
    if (activeId && !document.getElementById('profileModal').classList.contains('hidden')) {
      let exists = db.students.some(x => x.id === activeId);
      if (exists) window.openProfile(activeId);
      else window.toggleBox('profileModal');
    }
  }

  async function saveDb() {
    try { localStorage.setItem('tuition_v4', JSON.stringify(db)); } catch(e) {}
    updateUI();
    try {
      await setDoc(docRef, db);
    } catch(e) {
      console.error("Cloud Save Error:", e);
      msg("⚠️ Local saved, Cloud error!");
    }
  }

  function msg(t) {
    let b = document.getElementById('msgBox');
    b.innerText = t; b.classList.remove('hidden');
    setTimeout(() => b.classList.add('hidden'), 2500);
  }

  window.toggleBox = function(id) {
    document.getElementById(id).classList.toggle('hidden');
  };

  function calcFee(s) {
    let j = new Date(s.joinDate), n = new Date();
    let m = isNaN(j) ? 1 : (n.getFullYear() - j.getFullYear()) * 12 + (n.getMonth() - j.getMonth()) + (n.getDate() >= j.getDate() ? 1 : 0);
    m = Math.max(1, m);
    let paid = (s.payments || []).reduce((a, b) => a + b.amount, 0);
    let due = Math.max(0, (m * s.fee) - paid);
    return { m, paid, due };
  }

  window.renderList = function() {
    let box = document.getElementById('studentList');
    let q = document.getElementById('searchBox').value.toLowerCase();
    box.innerHTML = '';
    (db.students || []).filter(s => s.name.toLowerCase().includes(q)).forEach(s => {
      let { m, paid, due } = calcFee(s);
      let badge = due > 0 ? `<span class="bg-red-500/20 text-red-300 text-xs font-bold px-2 py-1 rounded-full">Due: ₹${due}</span>`
                          : `<span class="bg-emerald-500/20 text-emerald-300 text-xs font-bold px-2 py-1 rounded-full">Clear ₹0</span>`;
      box.innerHTML += `
        <div onclick="openProfile(${s.id})" class="bg-slate-800 p-3.5 rounded-xl border border-slate-700 flex justify-between items-center cursor-pointer">
          <div>
            <h3 class="font-bold text-white text-sm">${s.name}</h3>
            <p class="text-[11px] text-slate-400">Joined: ${s.joinDate} (${m} Mo) • Fee: ₹${s.fee}</p>
          </div>
          <div class="text-right">${badge}<p class="text-[11px] text-indigo-400 font-bold mt-1">Open →</p></div>
        </div>`;
    });
  };

  window.addStudent = function() {
    let name = document.getElementById('stuName').value.trim();
    let phone = document.getElementById('stuPhone').value.trim();
    let joinDate = document.getElementById('joinDate').value;
    let fee = Number(document.getElementById('monthlyFee').value);
    if (!name || !joinDate || !fee) return msg("⚠️ Naam, Date aur Fee teeno bharein!");
    db.students.push({ id: Date.now(), name, phone, joinDate, fee, payments: [] });
    document.getElementById('stuName').value = '';
    document.getElementById('stuPhone').value = '';
    document.getElementById('monthlyFee').value = '';
    saveDb(); msg("☁️ Student Cloud Par Save Ho Gaya!");
  };

  window.openProfile = function(id) {
    activeId = id;
    let s = db.students.find(x => x.id === id);
    if (!s) return;
    let { m, paid, due } = calcFee(s);
    document.getElementById('mName').innerText = s.name;
    document.getElementById('mJoin').innerText = `Joined: ${s.joinDate} • ${m} Months Billed`;
    document.getElementById('mFee').innerText = `₹${s.fee}`;
    document.getElementById('mPaid').innerText = `₹${paid}`;
    document.getElementById('mDue').innerText = `₹${due}`;

    let upi = document.getElementById('upiBtn');
    upi.href = `upi://pay?pa=${db.settings.upi}&pn=${encodeURIComponent(db.settings.name)}&am=${due}&cu=INR`;
    upi.innerText = due > 0 ? `💳 Pay Pending ₹${due} via UPI` : `✅ All Fee Cleared (₹0)`;

    let h = document.getElementById('historyList');
    h.innerHTML = (s.payments && s.payments.length) ? s.payments.slice().reverse().map(p => 
      `<li class="flex justify-between bg-slate-900 p-2 rounded border border-slate-700"><b class="text-emerald-400">+ ₹${p.amount}</b><span class="text-slate-400">${p.time}</span></li>`
    ).join('') : `<li class="text-slate-500 italic">No payments yet.</li>`;

    document.getElementById('profileModal').classList.remove('hidden');
  };

  window.addPayment = function() {
    let amt = Number(document.getElementById('payAmt').value);
    if (!amt) return;
    let s = db.students.find(x => x.id === activeId);
    let now = new Date();
    let time = now.toLocaleDateString('en-IN', {day:'2-digit', month:'short', year:'numeric'}) + ', ' + now.toLocaleTimeString('en-IN', {hour:'2-digit', minute:'2-digit'});
    if (!s.payments) s.payments = [];
    s.payments.push({ amount: amt, time });
    document.getElementById('payAmt').value = '';
    saveDb(); window.openProfile(activeId); msg("☁️ Payment Cloud Par Update Ho Gayi!");
  };

    window.sendWhatsApp = function() {
    let s = db.students.find(x => x.id === activeId);
    let { due } = calcFee(s);
    let appLink = window.location.origin; 

    let text = `Namaste 🙏\n\n*${s.name}* ki pending tuition fee *₹${due}* hai.\n\nKripya is link par click karein aur seedhe UPI (PhonePe/GPay) se payment karein 👇\n\n🔗 ${appLink}`;

    let ph = (s.phone || "").replace(/\D/g, '');
    let url = (ph.length === 10 ? `https://wa.me/91${ph}` : `https://wa.me/`) + `?text=${encodeURIComponent(text)}`;
    window.open(url, '_blank');
  };
  
  window.deleteStu = function() {
    db.students = db.students.filter(x => x.id !== activeId);
    saveDb(); window.toggleBox('profileModal'); msg("🗑️ Profile Deleted from Cloud!");
  };

  window.saveSettings = function() {
    db.settings.name = document.getElementById('setTuition').value.trim() || db.settings.name;
    db.settings.upi = document.getElementById('setUpi').value.trim() || db.settings.upi;
    db.settings.pin = document.getElementById('setPin').value.trim() || "1234";
    saveDb(); window.toggleBox('settingsBody'); msg("☁️ Settings Cloud Par Save Ho Gayi!");
  };

  window.handleRoleSwitch = function() {
    if (isAdmin) setRole(false);
    else { document.getElementById('pinInput').value = ''; window.toggleBox('pinModal'); }
  };

  window.verifyPin = function() {
    if (document.getElementById('pinInput').value === db.settings.pin) {
      setRole(true); window.toggleBox('pinModal'); msg("🔓 Admin Unlocked!");
    } else msg("❌ Wrong PIN! (Default: 1234)");
  };

  function setRole(admin) {
    isAdmin = admin;
    document.getElementById('adminPanel').classList.toggle('hidden', !admin);
    document.getElementById('adminControls').classList.toggle('hidden', !admin);
    document.getElementById('delBox').classList.toggle('hidden', !admin);
    document.getElementById('modeText').innerText = admin ? "Mode: Admin (Unlocked 🔓)" : "Mode: Parent View (Read-Only 👁️)";
    document.getElementById('roleBtn').innerText = admin ? "Lock Parent View 🔒" : "Admin Unlock 🔑";
  }

  updateUI();
</script>
</body>
</html>
